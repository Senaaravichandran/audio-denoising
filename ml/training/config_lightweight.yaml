# Lightweight DCCRN Configuration for Low-Resource Systems
# Optimized for Intel i3-7020U, 8GB RAM, Limited Storage

# Data Configuration
data:
  clean_dir: "data/clean"
  noisy_dir: "data/noisy"
  sample_rate: 16000
  n_fft: 512        # Reduced from 1024 to save memory
  hop_length: 128   # Reduced from 256 to save memory
  win_length: 512   # Reduced from 1024
  max_length: 32000 # 2 seconds max (reduced from 4 seconds)
  
# Model Configuration (Lightweight)
model:
  rnn_layers: 1      # Reduced from 2 layers
  rnn_units: 64      # Reduced from 128 units
  fc_dim: 64         # Reduced from 128
  kernel_size: [5, 3] # Slightly smaller kernels
  kernel_num: [16, 32, 64] # Reduced channel count
  dropout: 0.2
  
# Training Configuration
training:
  batch_size: 2      # Very small batch size for 8GB RAM
  num_epochs: 20     # Reduced epochs for faster training
  learning_rate: 0.0005
  weight_decay: 1e-5
  gradient_clip_norm: 5.0
  num_workers: 1     # Single worker to save RAM
  pin_memory: false  # Disable to save memory
  
# Validation Configuration
validation:
  batch_size: 1      # Minimal validation batch
  split_ratio: 0.1   # Only 10% for validation to save storage
  
# Checkpoint Configuration
checkpoint:
  save_dir: "checkpoints"
  save_every: 5      # Save less frequently to save storage
  keep_best_only: true # Keep only the best model
  max_checkpoints: 2   # Keep maximum 2 checkpoints only
  
# Optimization for Low Resources
optimization:
  mixed_precision: false  # Disable mixed precision on older hardware
  cpu_only: true          # Force CPU training on Intel HD Graphics
  memory_efficient: true  # Enable memory optimization
  cache_dataset: false    # Don't cache to save RAM
  
# Logging Configuration
logging:
  log_level: "INFO"
  tensorboard: false     # Disable TensorBoard to save resources
  console_log_interval: 10
  
# Data Processing
processing:
  normalize_audio: true
  trim_silence: true     # Remove silence to reduce data size
  augmentation: false    # Disable augmentation to save time
  max_files_per_subset: 50 # Limit training data for faster iteration
  
# Output Configuration
output:
  model_name: "dccrn_lightweight"
  export_onnx: false     # Skip ONNX export to save space
  cleanup_temp: true     # Clean temporary files immediately
